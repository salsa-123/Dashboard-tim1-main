<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Tim 1</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="app">
<!-- ==========================================================================
     STRUKTUR HTML SIDEBAR (VERSI TOMBOL KOTAK KECIL DENGAN GARIS & PANAH HOVER)
     ========================================================================== -->

<!-- SIDEBAR -->
<aside class="sidebar" id="mySidebar">
  <div class="sidebar-brand">
    <!-- 🟢 TOMBOL KOTAK KECIL (Hanya garis lurus, panah muncul saat hover kursor) -->
    <button id="brandToggle" class="brand-toggle-btn">
      <span class="toggle-icon">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <!-- Garis Tegak Lurus Tetap (Selalu Muncul) -->
          <line x1="6" y1="4" x2="6" y2="20" class="gemini-line"></line>
          <!-- Panah Kiri (Tersembunyi, Muncul Saat Hover) -->
          <polyline points="18 5 11 12 18 19" class="gemini-arrow"></polyline>
        </svg>
      </span>
      
      <!-- Balon text hitam melayang di samping tombol -->
      <span class="sidebar-tooltip">Tutup sidebar</span>
    </button>

    <!-- 🟢 LOGO & NAMA APLIKASI (Terpisah rapi agar tidak ikut rusak/terdorong teks) -->
    <div class="brand-logo-wrapper">
      <span class="brand-name">Team Work</span>
    </div>
  </div>

  <nav class="sidebar-nav">
  <!-- Dashboard -->
  <a href="dashboard.html" class="nav-item" data-page="dashboard">
    <span class="nav-icon"><i class="fa-solid fa-gauge"></i></span> Dashboard
  </a>

  <!-- Proyek -->
  <a href="proyek.html" class="nav-item" data-page="proyek">
    <span class="nav-icon"><i class="fa-solid fa-folder-open"></i></span> Proyek
  </a>

  <!-- Tugas -->
  <a href="tugas.html" class="nav-item" data-page="tugas">
    <span class="nav-icon"><i class="fa-solid fa-list-check"></i></span> Tugas
  </a>

  <!-- Laporan -->
  <a href="laporan.html" class="nav-item" data-page="laporan">
    <span class="nav-icon"><i class="fa-solid fa-chart-line"></i></span> Laporan
  </a>

  <!-- Tambah Pengguna -->
<a href="pengaturan.html" class="nav-item" data-page="pengaturan">
  <span class="nav-icon"><i class="fa-solid fa-user-plus"></i></span> Tambah Pengguna
</a>
</nav>
</aside>
<script>
  if (localStorage.getItem('sidebarCollapsed') === 'true') {
    document.getElementById('mySidebar').classList.add('collapsed');
  }
</script>

<!-- ================= HALAMAN PENGATURAN ================= -->
<section class="page" id="page-pengaturan">
    <div class="container">
        <div class="card">
  <h1>Tambah Pengguna</h1>

  <h3 class="tp-heading"><i class="fa-solid fa-user-plus"></i> Data Pengguna Baru</h3>
  <div class="tp-form">
    <div class="setting-row">
      <span>Nama Lengkap</span>
      <input type="text" id="inputNamaPengguna" placeholder="Nama lengkap">
    </div>
    <div class="setting-row">
      <span>Email</span>
      <input type="email" id="inputEmailPengguna" placeholder="nama@example.com">
    </div>
    <div class="setting-row">
      <span>Role</span>
      <select id="inputRolePengguna">
        <option value="admin">Admin</option>
        <option value="anggota">Anggota</option>
      </select>
    </div>
  </div>

  <div style="margin-top: 20px; text-align: right;">
    <button class="btn" onclick="simpanPengguna()"><i class="fa-solid fa-plus"></i> Simpan Pengguna</button>
  </div>

  <h3 class="tp-heading" style="margin-top:40px;"><i class="fa-solid fa-users"></i> Pengguna Terdaftar</h3>
  <table class="table-pengguna">
    <thead>
      <tr>
        <th>Nama</th>
        <th>Email</th>
        <th>Role</th>
        <th style="text-align:right;">Aksi</th>
      </tr>
    </thead>
    <tbody id="listPengguna"></tbody>
  </table>
</div>
        </div>
    </div>
</section>

    

   <script src="script.js"></script>

  </body>
</html>
