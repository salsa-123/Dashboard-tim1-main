<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — Teamwork</title>
<link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="login-page">
    <form class="login-card" id="loginForm">
      <h1 class="login-title">Team Work</h1>

      <div class="avatar-circle">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </div>

      <div class="field">
        <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <input id="nama" name="nama" type="text" placeholder="Nama" autocomplete="name" required />
      </div>

      <div class="field">
        <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <input id="username" name="username" type="text" placeholder="Username" autocomplete="username" required />
      </div>

      <div class="field">
        <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required />
        <button type="button" class="toggle-btn" id="togglePassword" aria-label="Tampilkan password">
          <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>

      <div class="options-row">
        <label class="remember-label">
          <input type="checkbox" id="rememberMe" checked />
          Remember me
        </label>
        <a href="#" class="forgot-link" id="forgotLink">Forgot password?</a>
      </div>

      <p class="error-msg" id="errorMsg" style="display:none;"></p>

      <button type="submit" class="submit-btn" id="submitBtn">
        <span id="submitText">LOGIN</span>
      </button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
