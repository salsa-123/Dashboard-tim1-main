<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Tim 1</title>
    <link rel="stylesheet" href="style.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="app">
<!-- ==========================================================================
     STRUKTUR HTML SIDEBAR (VERSI TOMBOL KOTAK KECIL DENGAN GARIS & PANAH HOVER)
     ========================================================================== -->

<!-- SIDEBAR -->
<aside class="sidebar" id="mySidebar">
  <div class="sidebar-brand">
    <!-- 🟢 TOMBOL KOTAK KECIL (Hanya garis lurus, panah muncul saat hover kursor) -->
    <button id="brandToggle" class="brand-toggle-btn">
      <span class="toggle-icon">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <!-- Garis Tegak Lurus Tetap (Selalu Muncul) -->
          <line x1="6" y1="4" x2="6" y2="20" class="gemini-line"></line>
          <!-- Panah Kiri (Tersembunyi, Muncul Saat Hover) -->
          <polyline points="18 5 11 12 18 19" class="gemini-arrow"></polyline>
        </svg>
      </span>
      
      <!-- Balon text hitam melayang di samping tombol -->
      <span class="sidebar-tooltip">Tutup sidebar</span>
    </button>

    <!-- 🟢 LOGO & NAMA APLIKASI (Terpisah rapi agar tidak ikut rusak/terdorong teks) -->
    <div class="brand-logo-wrapper">
      <span class="brand-name">Team Work</span>
    </div>
  </div>

  <nav class="sidebar-nav">
  <!-- Dashboard -->
  <a href="dashboard.html" class="nav-item" data-page="dashboard">
    <span class="nav-icon"><i class="fa-solid fa-gauge"></i></span> Dashboard
  </a>

  <!-- Proyek -->
  <a href="proyek.html" class="nav-item" data-page="proyek">
    <span class="nav-icon"><i class="fa-solid fa-folder-open"></i></span> Proyek
  </a>

  <!-- Tugas -->
  <a href="tugas.html" class="nav-item" data-page="tugas">
    <span class="nav-icon"><i class="fa-solid fa-list-check"></i></span> Tugas
  </a>

  <!-- Laporan -->
  <a href="laporan.html" class="nav-item" data-page="laporan">
    <span class="nav-icon"><i class="fa-solid fa-chart-line"></i></span> Laporan
  </a>

  <!-- Tambah Pengguna -->
<a href="pengaturan.html" class="nav-item" data-page="pengaturan">
  <span class="nav-icon"><i class="fa-solid fa-user-plus"></i></span> Tambah Pengguna
</a>
</nav>
  

</aside>

<script>
  if (localStorage.getItem('sidebarCollapsed') === 'true') {
    document.getElementById('mySidebar').classList.add('collapsed');
  }
</script>

<!-- HALAMAN: DASHBOARD -->
<section class="page active" id="page-dashboard">
  <div class="panel">

    <!-- 1. HEADER RINGKASAN PROYEK & PENCARIAN (BERADA DI PALING ATAS) -->
    <div class="section-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h2 style="margin: 0; font-size: 18px; font-weight: 600; color: #0f172a;">Ringkasan Proyek</h2>
      <div class="search-container">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="#94a3b8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        <input type="text" id="searchProject" placeholder="Cari proyek...">
      </div>
    </div>

    <div class="stats-container">
<div class="stat-card">
    <div class="stat-icon total"><i class="fas fa-folder-open"></i></div>
    <div class="stat-info">
        <p>Total Proyek</p>
        <h3 id="statTotal">6</h3>
    </div>
</div>

    <!-- Selesai -->
<div class="stat-card">
    <div class="stat-icon done"><i class="fas fa-check"></i></div>
    <div class="stat-info">
        <p>Selesai</p>
        <h3 id="statSelesai">1</h3>
    </div>
</div>

<!-- Sedang Berjalan -->
<div class="stat-card">
    <div class="stat-icon progress"><i class="fas fa-spinner"></i></div>
    <div class="stat-info">
        <p>Sedang Berjalan</p>
        <h3 id="statProgress">3</h3>
    </div>
</div>

<!-- Belum Mulai -->
<div class="stat-card">
    <div class="stat-icon pending"><i class="fas fa-lock"></i></div>
    <div class="stat-info">
        <p>Belum Mulai</p>
        <h3 id="statPending">2</h3>
    </div>
</div>
</div>

<div class="section-header">

      
    <!-- 3. KONTEN CAROUSEL PROYEK (DIBUNGKUS KOTAK OUTSIDE) -->
    <div class="carousel-wrapper" style="position: relative;">
      
      <!-- TOMBOL PANAH NAVIGASI -->
      <button class="carousel-btn prev-btn" id="btnPrev" aria-label="Sebelumnya">&#10094;</button>
      <button class="carousel-btn next-btn" id="btnNext" aria-label="Selanjutnya">&#10095;</button>
      
      <!-- JALUR GRID PROYEK -->
      <div class="project-grid" id="dashboardTrack">
      
    </div>
  
    <!-- Contoh di dalam project-item -->
  </div>
</div>

</div>
</div>
</section>

   <script src="script.js"></script>

  </body>
</html>
